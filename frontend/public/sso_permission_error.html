<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Permission</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    /* 图标区域 */
    .icon-container {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }

    /* 淡色红圈背景 */
    .circle-bg {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #ffebee;
      /* 浅粉红，柔和的红圈 */
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 4px;
    }

    .lock-icon {
      color: #e53935;
      /* 红色锁 */
      font-size: 40px;
      margin-bottom: 4px;
    }

    .status-badge {
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #e53935;
      color: white;
      font-size: 14px;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      width: 40px;
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    /* 文字内容 */
    h1 {
      font-size: 28px;
      color: #333;
      margin: 16px 0;
    }

    p {
      color: #666;
      line-height: 1.6;
      font-size: 16px;
      margin-bottom: 32px;
    }

    /* 按钮 */
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-back {
      background-color: #e0e0e0;
      color: #333;
    }

    .btn-home {
      background-color: #4caf50;
      color: white;
    }

    .btn:hover {
      opacity: 0.9;
    }

    @media (max-width: 480px) {
      .buttons {
        flex-direction: column;
        align-items: center;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 图标区 -->
    <div class="icon-container">
      <div class="circle-bg">
        <i class="fas fa-lock lock-icon"></i>
      </div>
      <div class="status-badge">401</div>
    </div>

    <!-- 文字 -->
    <h1>No Permission</h1>
    <p>You do not have permission to access this page or perform this action</p>

    <!-- 按钮 -->
    <div class="buttons">
      <a href="http://196.189.236.220:30006/agriculture/#/home" class="btn btn-back">
        <i class="fas fa-arrow-left"></i> Go Back
      </a>
      <a href="http://196.189.236.220:30006/agriculture/#/home" class="btn btn-home">
        <i class="fas fa-home"></i> Back to Home
      </a>
    </div>
  </div>
</body>

</html>
