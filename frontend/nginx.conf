# 六模块静态服务参考配置（与线上 oromia-nginx 容器内配置一致）
# 2026-08-17 端口迁移后：线上模块已改由宿主机 /app/nginx 的 30006 端口提供
# （配置块见 前端修改需求/01_端口改造/服务器执行脚本.md 中的 port30006_block.conf），
# 本文件保留作为模块应用 nginx 的参考模板（root=/home/appus/proj 与线上共用同一份静态文件）。
server {
    listen 80;
    server_name _;
    absolute_redirect off;

    charset utf-8;
    client_max_body_size 100m;

    root /home/appus/proj;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = / {
        try_files $uri $uri/ /index.html;
    }

    location /prod-api/ {
        proxy_pass http://172.26.100.103:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location ^~ /farmland/ {
        try_files $uri $uri/ /farmland/index.html;
    }

    location ^~ /production/ {
        try_files $uri $uri/ /production/index.html;
    }

    location ^~ /harvest/ {
        try_files $uri $uri/ /harvest/index.html;
    }

    location ^~ /logistics/ {
        try_files $uri $uri/ /logistics/index.html;
    }

    location ^~ /processing/ {
        try_files $uri $uri/ /processing/index.html;
    }

    location ^~ /sustainability/ {
        try_files $uri $uri/ /sustainability/index.html;
    }

    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|ico|svg|webp|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
